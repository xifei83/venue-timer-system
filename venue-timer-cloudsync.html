<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>场地计时计费系统 - 云同步版</title>
    <!-- 腾讯云 CloudBase SDK v1.10.10 -->
    <script src="https://imgcache.qq.com/qcloud/tcbjs/2.9.0/tcb.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            min-height: 100vh;
            padding: 20px;
            color: #333;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            color: white;
            margin-bottom: 30px;
            padding: 20px;
        }

        header h1 {
            font-size: 2.5rem;
            margin-bottom: 10px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        header p {
            font-size: 1.1rem;
            opacity: 0.8;
        }

        .card {
            background: white;
            border-radius: 16px;
            padding: 30px;
            margin-bottom: 20px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.3);
        }

        .card h2 {
            color: #1a1a2e;
            margin-bottom: 20px;
            font-size: 1.5rem;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        /* 场地管理部分 */
        .venue-section {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 20px;
            margin-bottom: 20px;
        }

        .venue-card {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 25px;
            border-radius: 12px;
            position: relative;
            transition: transform 0.3s ease;
        }

        .venue-card:hover {
            transform: translateY(-5px);
        }

        .venue-card.occupied {
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
        }

        .venue-card.selected {
            border: 3px solid #ffd700;
            box-shadow: 0 0 20px rgba(255, 215, 0, 0.5);
        }

        .venue-card h3 {
            font-size: 1.3rem;
            margin-bottom: 10px;
        }

        .venue-card .rate {
            font-size: 1.5rem;
            font-weight: bold;
            margin-bottom: 10px;
        }

        .venue-card .status {
            display: inline-block;
            padding: 5px 12px;
            background: rgba(255, 255, 255, 0.3);
            border-radius: 20px;
            font-size: 0.85rem;
            margin-bottom: 10px;
        }

        .venue-card .customer-info {
            font-size: 0.9rem;
            margin-top: 10px;
            padding-top: 10px;
            border-top: 1px solid rgba(255, 255, 255, 0.3);
        }

        .venue-card .timer {
            font-size: 2rem;
            font-weight: bold;
            font-family: 'Courier New', monospace;
            margin: 10px 0;
        }

        .venue-card .cost {
            font-size: 1.2rem;
            color: #ffd700;
        }

        .venue-card .actions {
            display: flex;
            gap: 10px;
            margin-top: 15px;
        }

        .venue-card .manage-buttons {
            display: flex;
            gap: 8px;
            margin-bottom: 10px;
        }

        .venue-card .btn-manage-mini {
            padding: 5px 12px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 0.85rem;
            font-weight: 500;
            transition: all 0.3s ease;
            background: rgba(255, 255, 255, 0.3);
            color: white;
        }

        .venue-card .btn-manage-mini:hover {
            background: rgba(255, 255, 255, 0.5);
            transform: scale(1.05);
        }

        .venue-card .btn-manage-mini.btn-edit {
            background: rgba(33, 150, 243, 0.8);
        }

        .venue-card .btn-manage-mini.btn-delete {
            background: rgba(244, 67, 54, 0.8);
        }

        .venue-card .btn {
            flex: 1;
            padding: 10px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.3s ease;
        }

        .btn-start {
            background: #4CAF50;
            color: white;
        }

        .btn-pause {
            background: #ff9500;
            color: white;
        }

        .btn-end {
            background: #f44336;
            color: white;
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.3);
        }

        /* 表单样式 */
        .form-group {
            margin-bottom: 15px;
        }

        .form-group label {
            display: block;
            margin-bottom: 5px;
            color: #666;
            font-weight: 500;
        }

        .form-group input,
        .form-group select {
            width: 100%;
            padding: 12px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 1rem;
            transition: border-color 0.3s;
        }

        .form-group input:focus,
        .form-group select:focus {
            outline: none;
            border-color: #667eea;
        }

        .form-row {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
        }

        /* 按钮样式 */
        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 12px 30px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.3s ease;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(102, 126, 234, 0.4);
        }

        /* 模态框 */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.7);
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        .modal.show {
            display: flex;
        }

        .modal-content {
            background: white;
            padding: 30px;
            border-radius: 16px;
            width: 90%;
            max-width: 500px;
            max-height: 90vh;
            overflow-y: auto;
        }

        .modal-content h3 {
            color: #1a1a2e;
            margin-bottom: 20px;
            font-size: 1.5rem;
        }

        .modal-buttons {
            display: flex;
            gap: 10px;
            margin-top: 20px;
        }

        .btn-modal {
            flex: 1;
            padding: 12px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.3s ease;
        }

        .btn-confirm {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .btn-cancel {
            background: #e0e0e0;
            color: #666;
        }

        /* 统计卡片 */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 20px;
        }

        .stat-card {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 25px;
            border-radius: 12px;
            text-align: center;
        }

        .stat-card h4 {
            font-size: 0.9rem;
            opacity: 0.9;
            margin-bottom: 10px;
        }

        .stat-card .value {
            font-size: 2rem;
            font-weight: bold;
        }

        .stat-card .sub-value {
            font-size: 0.85rem;
            opacity: 0.8;
            margin-top: 5px;
        }

        /* 云同步状态指示器 */
        .cloud-sync-status {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 8px 15px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: 600;
            transition: all 0.3s ease;
        }

        .cloud-sync-status.connected {
            background: rgba(76, 175, 80, 0.2);
            color: #4CAF50;
            border: 2px solid #4CAF50;
        }

        .cloud-sync-status.disconnected {
            background: rgba(244, 67, 54, 0.2);
            color: #f44336;
            border: 2px solid #f44336;
        }

        .cloud-sync-status.syncing {
            background: rgba(255, 152, 0, 0.2);
            color: #ff9500;
            border: 2px solid #ff9500;
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        /* 空状态 */
        .empty-state {
            text-align: center;
            color: #999;
            padding: 40px;
        }

        /* 响应式 */
        @media (max-width: 768px) {
            header h1 {
                font-size: 1.8rem;
            }

            .venue-card .timer {
                font-size: 1.5rem;
            }

            .stats-grid {
                grid-template-columns: 1fr;
            }
        }

        /* 登录界面样式 */
        .login-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 9999;
        }

        .login-box {
            background: white;
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            text-align: center;
            max-width: 400px;
            width: 90%;
            animation: fadeIn 0.5s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .login-box h1 {
            margin: 0 0 10px 0;
            color: #667eea;
            font-size: 28px;
        }

        .login-box p {
            color: #666;
            margin: 0 0 30px 0;
        }

        .login-options {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .login-btn {
            padding: 15px 30px;
            border: none;
            border-radius: 10px;
            font-size: 18px;
            cursor: pointer;
            transition: all 0.3s ease;
            font-weight: bold;
        }

        .login-btn-upstairs {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .login-btn-upstairs:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 20px rgba(102, 126, 234, 0.4);
        }

        .login-btn-more {
            background: linear-gradient(135deg, #11998e 0%, #38ef7d 100%);
            color: white;
        }

        .login-btn-more:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 20px rgba(17, 153, 142, 0.4);
        }

    .system-hidden {
        display: none !important;
    }

        /* 网站访问密码层 */
        .site-password-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 99999 !important;
        }

        .site-password-box {
            background: white;
            padding: 40px;
            border-radius: 16px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            text-align: center;
            max-width: 400px;
            width: 90%;
        }

        .site-password-box h1 {
            color: #1a1a2e;
            margin-bottom: 20px;
            font-size: 28px;
        }

        .site-password-box p {
            color: #666;
            margin-bottom: 30px;
            font-size: 14px;
        }

        .site-password-box input[type="password"] {
            width: 100%;
            padding: 15px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 16px;
            margin-bottom: 20px;
            box-sizing: border-box;
            transition: border-color 0.3s;
        }

        .site-password-box input[type="password"]:focus {
            outline: none;
            border-color: #667eea;
        }

        .site-password-box button {
            width: 100%;
            padding: 15px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: transform 0.3s, box-shadow 0.3s;
        }

        .site-password-box button:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(102, 126, 234, 0.3);
        }
    </style>
</head>
<body>
    <!-- 登录界面 -->
    <div class="login-container" id="loginContainer">
        <div class="login-box">
            <h1>🏟️ 欢迎使用</h1>
            <p>请选择登录系统</p>
            <div class="login-options">
                <button class="login-btn login-btn-upstairs" onclick="showPasswordModal('upstairs')">Upstairs</button>
                <button class="login-btn login-btn-more" onclick="showPasswordModal('more')">More</button>
            </div>
            <div style="margin-top: 30px; padding: 15px; background: rgba(102, 126, 234, 0.1); border-radius: 8px;">
                <p style="font-size: 12px; color: #666; margin: 5px 0;">
                    <strong>☁️ 云同步已启用</strong><br>
                    多设备实时同步数据
                </p>
            </div>
        </div>
    </div>

    <!-- 密码验证弹窗 -->
    <div class="modal" id="passwordModal" style="display: none; z-index: 10000 !important;">
        <div class="modal-content" style="max-width: 400px; z-index: 10001 !important;">
            <h2 style="color: #667eea; margin-bottom: 20px;">🔐 验证密码</h2>
            <p id="passwordSystemName" style="margin-bottom: 20px; color: #666;"></p>
            <input type="password" id="passwordInput" placeholder="请输入密码"
                   style="width: 100%; padding: 12px; margin-bottom: 20px; border: 1px solid #ddd; border-radius: 8px; font-size: 16px;">
            <div style="display: flex; gap: 10px; justify-content: flex-end;">
                <button onclick="closePasswordModal()" style="padding: 10px 20px; border: none; border-radius: 8px; background: #95a5a6; color: white; cursor: pointer; font-size: 14px;">取消</button>
                <button onclick="confirmLogin()" style="padding: 10px 20px; border: none; border-radius: 8px; background: #667eea; color: white; cursor: pointer; font-size: 14px;">确认登录</button>
            </div>
        </div>
    </div>

    <!-- 主系统界面 -->
    <div class="container system-hidden" id="mainContainer">
        <header>
            <div style="display: flex; justify-content: space-between; align-items: center;">
                <div>
                    <h1 id="systemTitle">🏟️ 场地计时计费系统</h1>
                    <p>专业的场地租赁计时和费用管理系统 - 云同步版</p>
                </div>
                <div style="display: flex; gap: 10px; align-items: center;">
                    <div id="cloudSyncStatus" class="cloud-sync-status disconnected">
                        <span id="syncIcon">☁️</span>
                        <span id="syncText">云同步</span>
                    </div>
                    <button onclick="logout()" style="background: #e74c3c; color: white; border: none; padding: 10px 20px; border-radius: 8px; cursor: pointer; font-size: 14px; transition: all 0.3s;">
                        🚪 退出登录
                    </button>
                </div>
            </div>
        </header>

        <!-- 统计卡片 -->
        <div class="stats-grid">
            <div class="stat-card">
                <h4>今日收入</h4>
                <div class="value" id="todayIncome">¥0.00</div>
                <div class="sub-value" id="todayOrders">0 单</div>
            </div>
            <div class="stat-card">
                <h4>本月收入</h4>
                <div class="value" id="monthIncome">¥0.00</div>
                <div class="sub-value" id="monthOrders">0 单</div>
            </div>
            <div class="stat-card">
                <h4>使用中场地</h4>
                <div class="value" id="activeVenues">0</div>
                <div class="sub-value" id="totalVenues">0 个场地</div>
            </div>
            <div class="stat-card">
                <h4>累计收入</h4>
                <div class="value" id="totalIncome">¥0.00</div>
                <div class="sub-value" id="totalOrders">0 单</div>
            </div>
        </div>

        <!-- 场地管理 -->
        <div class="card">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
                <h2>📍 场地管理</h2>
                <button class="btn-primary" onclick="showAddVenueModal()">+ 添加场地</button>
            </div>
            <div class="venue-section" id="venueSection">
            </div>
        </div>
    </div>

    <!-- 添加场地模态框 -->
    <div class="modal" id="addVenueModal">
        <div class="modal-content">
            <button class="close-btn" style="position: absolute; top: 15px; right: 15px; background: none; border: none; font-size: 24px; cursor: pointer; color: #999;" onclick="hideAddVenueModal()">&times;</button>
            <h3>添加新场地</h3>
            <div class="form-group">
                <label>场地名称</label>
                <input type="text" id="newVenueName" placeholder="例如：1号羽毛球场、VIP包间等">
            </div>
            <div class="form-group">
                <label>费率（元/小时）</label>
                <input type="number" id="newVenueRate" placeholder="100" min="0" step="1">
            </div>
            <div class="modal-buttons">
                <button class="btn-modal btn-cancel" onclick="hideAddVenueModal()">取消</button>
                <button class="btn-modal btn-confirm" onclick="confirmAddVenue()">确认添加</button>
            </div>
        </div>
    </div>

    <!-- 编辑场地模态框 -->
    <div class="modal" id="editVenueModal">
        <div class="modal-content">
            <button class="close-btn" style="position: absolute; top: 15px; right: 15px; background: none; border: none; font-size: 24px; cursor: pointer; color: #999;" onclick="hideEditVenueModal()">&times;</button>
            <h3>编辑场地</h3>
            <input type="hidden" id="editVenueId">
            <div class="form-group">
                <label>场地名称</label>
                <input type="text" id="editVenueName" placeholder="例如：1号羽毛球场、VIP包间等">
            </div>
            <div class="form-group">
                <label>费率（元/小时）</label>
                <input type="number" id="editVenueRate" placeholder="100" min="0" step="1">
            </div>
            <div class="modal-buttons">
                <button class="btn-modal btn-cancel" onclick="hideEditVenueModal()">取消</button>
                <button class="btn-modal btn-confirm" onclick="confirmEditVenue()">保存修改</button>
            </div>
        </div>
    </div>

    <!-- 开始使用模态框 -->
    <div class="modal" id="startUseModal">
        <div class="modal-content">
            <button class="close-btn" style="position: absolute; top: 15px; right: 15px; background: none; border: none; font-size: 24px; cursor: pointer; color: #999;" onclick="hideStartUseModal()">&times;</button>
            <h3>开始使用场地</h3>
            <input type="hidden" id="selectedVenueId">
            <div class="form-group">
                <label>场地名称</label>
                <input type="text" id="venueNameDisplay" readonly style="background: #f5f5f5;">
            </div>
            <div class="form-group">
                <label>客户名称 <span style="color: red;">*</span></label>
                <input type="text" id="customerName" placeholder="请输入客户姓名">
            </div>
            <div class="form-group">
                <label>联系电话 <span style="color: red;">*</span></label>
                <input type="tel" id="customerPhone" placeholder="请输入联系电话">
            </div>
            <div class="form-group">
                <label>人数</label>
                <input type="number" id="peopleCount" placeholder="请输入人数" min="1">
            </div>
            <div class="form-group">
                <label>费率（元/小时）</label>
                <input type="number" id="autoRate" placeholder="自动计算" readonly style="background: #f0f0f0;">
            </div>
            <div class="modal-buttons">
                <button class="btn-modal btn-cancel" onclick="hideStartUseModal()">取消</button>
                <button class="btn-modal btn-confirm" onclick="confirmStartUse()">开始使用</button>
            </div>
        </div>
    </div>

    <!-- 结束使用模态框 -->
    <div class="modal" id="endUseModal">
        <div class="modal-content">
            <button class="close-btn" style="position: absolute; top: 15px; right: 15px; background: none; border: none; font-size: 24px; cursor: pointer; color: #999;" onclick="hideEndUseModal()">&times;</button>
            <h3>结束使用</h3>
            <input type="hidden" id="endUseVenueId">
            <div class="form-group">
                <label>场地名称</label>
                <input type="text" id="endUseVenueName" readonly style="background: #f5f5f5;">
            </div>
            <div class="form-group">
                <label>客户名称</label>
                <input type="text" id="endUseCustomerName" readonly style="background: #f5f5f5;">
            </div>
            <div class="form-group">
                <label>开始时间</label>
                <input type="datetime-local" id="endUseStartTime" readonly>
            </div>
            <div class="form-group">
                <label>结束时间</label>
                <input type="datetime-local" id="endUseEndTime" readonly>
            </div>
            <div class="form-group" style="background: #f0f0f0; padding: 15px; border-radius: 8px;">
                <label style="margin-bottom: 8px;">费用预览</label>
                <div style="font-size: 1.2rem; font-weight: bold; color: #667eea;">
                    使用时长: <span id="endUseDurationPreview">0分钟</span><br>
                    费用: <strong id="endUseTotalCostPreview">¥0.00</strong>
                </div>
            </div>
            <div class="modal-buttons">
                <button class="btn-modal btn-cancel" onclick="hideEndUseModal()">取消</button>
                <button class="btn-modal btn-confirm" onclick="confirmEndUse()">确认结束</button>
            </div>
        </div>
    </div>

    <script>
        // ========== 全局变量 ==========
        let venues = [];
        let records = [];
        let venueTimers = {};
        let currentSystem = null;
        let pendingSystem = null;

        // 云数据库相关
        let db = null;
        let app = null;
        let cloudInitialized = false;
        let useCloud = true;
        let deviceId = null;

        // CloudBase 环境配置
        const ENV_ID = 'venue-timer-9gpg4ho7f667d5d8'; // 已更新为您的环境ID

        // 系统配置

                    env: ENV_ID,

                });

                    // 使用新版 SDK 的匿名登录方法
                    const loginResult = await auth.signInAnonymously();
                    
                    if (loginResult) {
                        console.log('✅ CloudBase 匿名登录成功:', loginResult);
                        cloudInitialized = true;
                        
                        // 获取登录状态确认

                        if (loginState && loginState.isAnonymous) {

                        }
                    } else {
                        throw new Error('匿名登录返回空结果');
                    }
                } catch (loginError) {
                    console.error('❌ CloudBase 登录失败:', loginError);

                    let errorMessage = 'CloudBase 登录失败: ' + loginError.message;
                    
                    if (loginError.code === 'ACCESS_TOKEN_DISABLED' || loginError.message.includes('anonymous') || loginError.message.includes('匿名登录')) {
                        errorMessage = '🚨 CloudBase 匿名登录未启用！\n\n请在腾讯云控制台进行以下配置：\n\n1. 访问: https://console.cloud.tencent.com/tcb\n2. 选择环境: ' + ENV_ID + '\n3. 点击左侧菜单"登录授权"\n4. 找到"匿名登录"选项\n5. 点击"编辑"\n6. 开启"启用匿名登录"开关\n7. 点击"保存"\n\n配置完成后，刷新页面重试。';

                    }
                    
                    alert(errorMessage);
                    useCloud = false;
                    updateCloudSyncStatus('disconnected', loginError.code === 'PERMISSION_DENIED' ? '权限不足' : '连接失败');
                    return false;
                }

                db = app.database();
                cloudInitialized = true;
                console.log('CloudBase 初始化成功,环境ID:', ENV_ID);
                updateCloudSyncStatus('connected', '云同步已启用');

            } catch (error) {
                console.error('CloudBase 初始化失败:', error);
                updateCloudSyncStatus('disconnected', '连接失败');
                useCloud = false;
                return false;
            }
        }

        // 从云端获取数据
        async function getDataFromCloud(collectionName, systemName) {
            try {
                if (!cloudInitialized || !db) {
                    console.warn('云数据库未初始化');
                    return null;
                }

                updateCloudSyncStatus('syncing', '正在加载数据...');

                const result = await db.collection(collectionName)
                    .where({
                        systemName: systemName
                    })
                    .orderBy('updateTime', 'desc')
                    .get();

                const data = result.data || [];
                console.log(`从云端获取 ${collectionName}:`, data.length, '条');
                updateCloudSyncStatus('connected', '云同步已启用');
                return data;

            } catch (error) {
                console.error(`从云端获取 ${collectionName} 失败:`, error);
                updateCloudSyncStatus('disconnected', '同步失败');
                return null;
            }
        }

        // 恢复正在使用的场地计时
        function resumeVenueTimers() {
            const now = Date.now();
            
            venues.forEach(venue => {
                if (venue.status === 'occupied' && venue.startTime) {
                    const startTime = new Date(venue.startTime).getTime();
                    const elapsed = venue.elapsed || 0;
                    
                    // 计算实际经过的时间（包括可能的暂停）
                    if (venue.isPaused) {
                        // 如果暂停中，elapsed保持不变
                        venue.elapsed = elapsed;
                    } else {
                        // 如果未暂停，计算实际经过的时间
                        const actualElapsed = now - startTime;
                        venue.elapsed = actualElapsed > 0 ? actualElapsed : elapsed;
                    }
                    
                    // 如果未暂停，启动计时器
                    if (!venue.isPaused) {
                        startTimer(venue);
                    }
                }
            });
            
            console.log('场地计时器已恢复');
        }

        // 保存场地到云端
        async function saveVenues() {
            // 保存最后保存时间
            localStorage.setItem(getStorageKey('lastSaveTime'), Date.now().toString());
            localStorage.setItem(getStorageKey('venues'), JSON.stringify(venues));

            if (useCloud && cloudInitialized) {
                // 保存每个场地到云端
                for (const venue of venues) {
                    try {
                        // 检查是否已有云端ID
                        if (venue._id) {
                            // 更新现有记录
                            await updateDataInCloud('venues', venue._id, venue);
                        } else {
                            // 新增记录
                            const result = await saveDataToCloud('venues', venue);
                            if (result && result.id) {
                                venue._id = result.id;
                            }
                        }
                    } catch (error) {
                        console.error(`保存场地 ${venue.name} 到云端失败:`, error);
                    }
                }
            }
        }

                    <div class="rate">¥${venue.rate}/小时</div>
                    <div class="status">${venue.status === 'free' ? '空闲' : '使用中'}</div>
                    ${venue.status === 'occupied' ? `
                        <div class="timer">${formatTime(venue.elapsed || 0)}</div>
                        <div class="cost">¥${calculateCost(venue.elapsed || 0, venue.rate)}</div>
                        <div class="customer-info">

        async function confirmStartUse() {
            const venueId = parseInt(document.getElementById('selectedVenueId').value);
            const customerName = document.getElementById('customerName').value.trim();
            const customerPhone = document.getElementById('customerPhone').value.trim();
            const peopleCount = document.getElementById('peopleCount').value;

            if (!customerName || !customerPhone) {
                alert('请填写客户名称和联系电话');
                return;
            }

            const venue = venues.find(v => v.id === venueId);
            if (!venue) return;

            venue.status = 'occupied';
            venue.startTime = new Date().toISOString();
            venue.elapsed = 0;
            venue.customer = {
                name: customerName,
                phone: customerPhone
            };
            venue.peopleCount = peopleCount || null;

            await saveVenues();
            startTimer(venue);
            renderVenues();
            hideStartUseModal();
        }

        function startTimer(venue) {
            venue.timer = setInterval(() => {
                venue.elapsed += 1000;
                updateVenueDisplay(venue);
                saveVenues();
            }, 1000);
        }

        function updateVenueDisplay(venue) {
            const venueElement = document.getElementById(`venue-${venue.id}`);
            if (venueElement) {
                const timerElement = venueElement.querySelector('.timer');
                const costElement = venueElement.querySelector('.cost');
                if (timerElement) {
                    timerElement.textContent = formatTime(venue.elapsed);
                }
                if (costElement) {
                    costElement.textContent = `¥${calculateCost(venue.elapsed, venue.rate)}`;
                }
            }
        }

        function togglePause(id) {
            const venue = venues.find(v => v.id === id);
            if (!venue) return;

            if (venue.isPaused) {
                venue.isPaused = false;
                startTimer(venue);
            } else {
                venue.isPaused = true;
                if (venue.timer) {
                    clearInterval(venue.timer);
                }
            }

            saveVenues();
            renderVenues();
        }

        function endUse(id) {
            const venue = venues.find(v => v.id === id);
            if (!venue) return;

            showEndUseModal(venue);
        }

        function showEndUseModal(venue) {
            if (venue.timer) {
                clearInterval(venue.timer);
            }

            document.getElementById('endUseVenueName').value = venue.name;
            document.getElementById('endUseCustomerName').value = venue.customer.name;
            document.getElementById('endUseVenueId').value = venue.id;

            const startDate = new Date(venue.startTime);
            document.getElementById('endUseStartTime').value = formatDateTimeForInput(startDate);

            const now = new Date();
            document.getElementById('endUseEndTime').value = formatDateTimeForInput(now);

            updateEndUseCost(venue);
            document.getElementById('endUseModal').classList.add('show');
        }

        function formatDateTimeForInput(date) {
            const year = date.getFullYear();
            const month = (date.getMonth() + 1).toString().padStart(2, '0');
            const day = date.getDate().toString().padStart(2, '0');
            const hours = date.getHours().toString().padStart(2, '0');
            const minutes = date.getMinutes().toString().padStart(2, '0');
            return `${year}-${month}-${day}T${hours}:${minutes}`;
        }

        function updateEndUseCost(venue) {
            const duration = venue.elapsed;
            const cost = calculateCost(duration, venue.rate);
            document.getElementById('endUseDurationPreview').textContent = formatDuration(duration);
            document.getElementById('endUseTotalCostPreview').textContent = `¥${cost}`;
        }

        function hideEndUseModal() {
            document.getElementById('endUseModal').classList.remove('show');
        }

        async function confirmEndUse() {
            const venueId = parseInt(document.getElementById('endUseVenueId').value);
            const venue = venues.find(v => v.id === venueId);
            if (!venue) return;

            // 生成唯一订单号
            const orderId = 'ORD' + Date.now() + Math.random().toString(36).substr(2, 6).toUpperCase();
            
            const record = {
                id: orderId,
                venueName: venue.name,
                venueId: venueId,
                customerName: venue.customer.name,
                customerPhone: venue.customer.phone,
                peopleCount: venue.peopleCount,
                startTime: venue.startTime,
                endTime: new Date().toISOString(),
                duration: venue.elapsed,
                rate: venue.rate,
                cost: calculateCost(venue.elapsed, venue.rate),
                paymentMethods: [],
                isPaused: venue.isPaused,
                pauseCount: venue.pauseCount || 0,
                totalPausedTime: venue.totalPausedTime || 0,
                createTime: new Date().toISOString(),
                systemName: systemConfig[currentSystem].name,
                deviceId: deviceId
            };

            records.push(record);
            await saveRecords();

            // 重置场地状态
            venue.status = 'free';
            venue.startTime = null;
            venue.elapsed = 0;
            venue.customer = null;
            venue.peopleCount = null;
            venue.isPaused = false;
            venue.pauseCount = 0;
            venue.totalPausedTime = 0;
            if (venue.timer) {
                clearInterval(venue.timer);
            }
            venue.timer = null;

            await saveVenues();
            renderVenues();
            updateStats();
            hideEndUseModal();

            alert(`✅ 使用结束\n\n📋 订单号: ${orderId}\n👤 客户: ${record.customerName}\n⏱️ 时长: ${formatDuration(record.duration)}\n💰 费用: ¥${record.cost}`);
        }

        // ========== 记录管理函数 ==========

        async function loadRecordsFromCloud() {
            const systemName = systemConfig[currentSystem].name;

            if (useCloud && cloudInitialized) {
                const cloudRecords = await getDataFromCloud('records', systemName);
                if (cloudRecords) {
                    records = cloudRecords;
                    console.log('从云端加载记录成功:', records.length, '条');
                    return;
                }
            }

            const savedRecords = localStorage.getItem(getStorageKey('records'));
            if (savedRecords) {
                records = JSON.parse(savedRecords);
            }
        }

        async function saveRecords() {
            localStorage.setItem(getStorageKey('records'), JSON.stringify(records));

            if (useCloud && cloudInitialized) {
                // 保存每条记录到云端
                for (const record of records) {
                    try {
                        if (!record._id) {
                            // 新增记录
                            const result = await saveDataToCloud('records', record);
                            if (result && result.id) {
                                record._id = result.id;
                            }
                        } else {
                            // 更新现有记录
                            await updateDataInCloud('records', record._id, record);
                        }
                    } catch (error) {
                        console.error(`保存记录 ${record.id} 到云端失败:`, error);
                    }
                }
            }
        }

        // ========== 工具函数 ==========

        function formatTime(ms) {
            const seconds = Math.floor(ms / 1000);
            const hours = Math.floor(seconds / 3600);
            const minutes = Math.floor((seconds % 3600) / 60);
            const secs = seconds % 60;
            return `${hours.toString().padStart(2, '0')}:${minutes.toString().padStart(2, '0')}:${secs.toString().padStart(2, '0')}`;
        }

        function formatDuration(ms) {
            const seconds = Math.floor(ms / 1000);
            const hours = Math.floor(seconds / 3600);
            const minutes = Math.floor((seconds % 3600) / 60);
            if (hours > 0) {
                return `${hours}小时${minutes}分钟`;
            }
            return `${minutes}分钟`;
        }

        function calculateCost(duration, rate) {
            const hours = duration / (1000 * 60 * 60);
            const cost = Math.ceil(hours * rate);
            return cost.toFixed(2);
        }

        function getStorageKey(key) {
            return `${currentSystem}_${key}`;
        }

        function updateStats() {
            const today = new Date();
            today.setHours(0, 0, 0, 0);

            const todayRecords = records.filter(r => new Date(r.createTime) >= today);
            const monthRecords = records.filter(r => {
                const date = new Date(r.createTime);
                return date.getMonth() === today.getMonth() && date.getFullYear() === today.getFullYear();
            });

            const todayIncome = todayRecords.reduce((sum, r) => sum + parseFloat(r.cost), 0);
            const monthIncome = monthRecords.reduce((sum, r) => sum + parseFloat(r.cost), 0);
            const totalIncome = records.reduce((sum, r) => sum + parseFloat(r.cost), 0);

            document.getElementById('todayIncome').textContent = `¥${todayIncome.toFixed(2)}`;
            document.getElementById('todayOrders').textContent = `${todayRecords.length} 单`;
            document.getElementById('monthIncome').textContent = `¥${monthIncome.toFixed(2)}`;
            document.getElementById('monthOrders').textContent = `${monthRecords.length} 单`;
            document.getElementById('totalIncome').textContent = `¥${totalIncome.toFixed(2)}`;
            document.getElementById('totalOrders').textContent = `${records.length} 单`;

            const activeCount = venues.filter(v => v.status === 'occupied').length;
            document.getElementById('activeVenues').textContent = activeCount;
            document.getElementById('totalVenues').textContent = `${venues.length} 个场地`;
        }

        // ========== 测试和验证函数 ==========

        // 测试云同步功能
        async function testCloudSync() {
            console.log('=== 开始云同步测试 ===');
            
            // 测试1: 检查 CloudBase 连接
            if (!cloudInitialized) {
                console.error('❌ 测试失败: CloudBase 未初始化');
                alert('CloudBase 未初始化，请检查网络连接');
                return false;
            }
            
            console.log('✅ CloudBase 连接正常');
            
            // 测试2: 测试数据读写
            try {
                const testData = {
                    test: '云同步测试',
                    timestamp: new Date().toISOString(),
                    deviceId: deviceId
                };
                
                const result = await saveDataToCloud('venues', testData);
                if (result && result.id) {
                    console.log('✅ 数据写入测试成功，文档ID:', result.id);
                    
                    // 测试数据读取
                    const readResult = await db.collection('venues')
                        .doc(result.id)
                        .get();
                    
                    if (readResult.data) {
                        console.log('✅ 数据读取测试成功');
                        console.log('读取的数据:', readResult.data);
                        
                        // 清理测试数据
                        await db.collection('venues')
                            .doc(result.id)
                            .remove();
                        console.log('✅ 测试数据已清理');
                        
                        alert('✅ 云同步测试成功！\n\n所有功能正常，可以开始使用。');
                        return true;
                    }
                }
            } catch (error) {
                console.error('❌ 云同步测试失败:', error);
                alert('❌ 云同步测试失败\n\n错误信息: ' + error.message);
                return false;
            }
            
            return false;
        }

        // 显示系统信息
        function showSystemInfo() {
            const info = `
🏟️ 场地计时计费系统 - 云同步版

📊 系统状态:
• 当前设备: ${deviceId}
• 云同步: ${cloudInitialized ? '✅ 已启用' : '❌ 未启用'}
• 当前系统: ${currentSystem ? systemConfig[currentSystem].name : '未登录'}
• 场地数量: ${venues.length}
• 记录数量: ${records.length}

🔧 技术信息:
• CloudBase 环境: ${ENV_ID}
• 浏览器: ${navigator.userAgent}
• 本地存储: ${localStorage.length} 项

📋 操作指南:
1. 配置 CloudBase 环境ID
2. 测试云同步功能
3. 开始使用场地管理
            `;
            
            alert(info);
        }

        // 手动同步数据
        async function manualSync() {
            if (!cloudInitialized) {
                alert('云同步未启用，无法手动同步');
                return;
            }
            
            const result = confirm('是否要手动同步所有数据到云端？\n\n这将更新所有场地和记录。');
            if (!result) return;
            
            updateCloudSyncStatus('syncing', '正在同步...');
            
            try {
                await saveVenues();
                await saveRecords();
                
                updateCloudSyncStatus('connected', '同步完成');
                alert('✅ 数据同步完成！\n\n所有数据已保存到云端。');
            } catch (error) {
                console.error('手动同步失败:', error);
                updateCloudSyncStatus('disconnected', '同步失败');
                alert('❌ 数据同步失败\n\n错误信息: ' + error.message);
            }
        }

        // 添加调试按钮到页面
        function addDebugButtons() {
            // 在退出登录按钮旁边添加调试按钮
            const headerButtons = document.querySelector('header > div > div');
            if (headerButtons && currentSystem) {
                const debugButton = document.createElement('button');
                debugButton.style.background = '#2196F3';
                debugButton.style.color = 'white';
                debugButton.style.border = 'none';
                debugButton.style.padding = '10px 15px';
                debugButton.style.borderRadius = '8px';
                debugButton.style.cursor = 'pointer';
                debugButton.style.fontSize = '14px';
                debugButton.style.transition = 'all 0.3s';
                debugButton.style.marginRight = '10px';
                debugButton.innerHTML = '🔧 系统信息';
                debugButton.onclick = showSystemInfo;
                debugButton.onmouseover = function() { this.style.transform = 'translateY(-2px)'; };
                debugButton.onmouseout = function() { this.style.transform = 'translateY(0)'; };
                
                const syncButton = document.createElement('button');
                syncButton.style.background = '#4CAF50';
                syncButton.style.color = 'white';
                syncButton.style.border = 'none';
                syncButton.style.padding = '10px 15px';
                syncButton.style.borderRadius = '8px';
                syncButton.style.cursor = 'pointer';
                syncButton.style.fontSize = '14px';
                syncButton.style.transition = 'all 0.3s';
                syncButton.innerHTML = '🔄 手动同步';
                syncButton.onclick = manualSync;
                syncButton.onmouseover = function() { this.style.transform = 'translateY(-2px)'; };
                syncButton.onmouseout = function() { this.style.transform = 'translateY(0)'; };
                
                // 在退出登录按钮前插入
                const logoutButton = headerButtons.querySelector('button[onclick="logout()"]');
                if (logoutButton) {
                    headerButtons.insertBefore(syncButton, logoutButton);
                    headerButtons.insertBefore(debugButton, syncButton);
                }
            }
        }

        // 在登录成功后调用
        setTimeout(addDebugButtons, 1000);
        
        // 添加测试快捷键
        document.addEventListener('keydown', function(event) {
            // Ctrl+Shift+T 测试云同步
            if (event.ctrlKey && event.shiftKey && event.key === 'T') {
                event.preventDefault();
                testCloudSync();
            }
            
            // Ctrl+Shift+I 显示系统信息
            if (event.ctrlKey && event.shiftKey && event.key === 'I') {
                event.preventDefault();
                showSystemInfo();
            }
            
            // Ctrl+Shift+S 手动同步
            if (event.ctrlKey && event.shiftKey && event.key === 'S') {
                event.preventDefault();
                manualSync();
            }
        });

        console.log('系统初始化完成，可以使用以下快捷键:');
        console.log('• Ctrl+Shift+T: 测试云同步');
        console.log('• Ctrl+Shift+I: 显示系统信息');
        console.log('• Ctrl+Shift+S: 手动同步数据');
    </script>
